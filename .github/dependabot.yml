# Weekly dependency update PRs, grouped so minor/patch bumps arrive as one PR
# per ecosystem instead of a pile. Majors stay individual — those deserve
# their own review. See issue #153 for why this exists (the react-router
# advisory sat unnoticed until a manual `npm audit` happened to run).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    # PRs go to development, not main: main only accepts PRs from
    # development (enforced by check-source-branch), so targeting the
    # default branch made every Dependabot PR unmergeable on arrival.
    target-branch: "development"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "development"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "development"
