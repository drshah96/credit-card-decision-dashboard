name: Create/Delete Branch for Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

# Keyed on the pull request number, not on github.ref.
#
# github.ref collides across pull requests, and the collision is silent and
# destructive: when two PRs are merged within seconds of each other, the second
# close event lands in the same concurrency group as the first and GitHub
# cancels the queued run. The cancelled run is the one that deletes the PR's
# Neon branch, so the branch is orphaned and nothing reports it.
#
# That is not hypothetical. Four preview branches survived their merged PRs
# this way: pr-155 and pr-163 (merged ~2 hours apart, each cancelled by a
# neighbour) and pr-187 and pr-188, merged three seconds apart on 2026-08-08.
# They were found by hand in the Neon console days later, and re-running the
# cancelled jobs one at a time deleted them.
#
# Per-PR grouping keeps the useful behaviour — a new push superseding an
# in-flight run for the same PR — without letting unrelated PRs cancel each
# other's cleanup.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.number }}

jobs:
  setup:
    name: Setup
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@v8

  create_neon_branch:
    name: Create Neon Branch
    # Pointed at the real step id. These referenced `create_neon_branch_encode`,
    # a step that does not exist in this workflow — a leftover from the template
    # this was generated from — so both job outputs were always the empty
    # string. Nothing consumed them, so nothing failed; a later job that did
    # would have received an empty DATABASE_URL and connected to the local
    # default instead of the preview branch.
    outputs:
      db_url: ${{ steps.create_neon_branch.outputs.db_url }}
      db_url_with_pooler: ${{ steps.create_neon_branch.outputs.db_url_with_pooler }}
    needs: setup
    if: |
      github.event_name == 'pull_request' && (
      github.event.action == 'synchronize'
      || github.event.action == 'opened'
      || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - name: Get branch expiration date as an env variable (2 weeks from now)
        id: get_expiration_date
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

      # Everything below is why the branch is created at all.
      #
      # A Neon branch is a copy-on-write clone of production, so it starts at
      # production's current schema and revision. Applying this PR's migrations
      # to it runs exactly the step production runs on its next deploy, against
      # real Postgres, before the merge rather than after.
      #
      # That gap is not theoretical. The dev database is SQLite, and Alembic
      # autogenerate renders defaults for whichever backend it is pointed at,
      # so `server_default=sa.text('0')` for a boolean is valid locally and
      # rejected by Postgres. On 2026-08-11 exactly that reached `main` and was
      # caught by reading the generated file, not by any check. This is the
      # check.
      - name: Check out the pull request
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.28"

      - name: Set up Python 3.13
        run: uv python install 3.13

      # The same command render.yaml builds with, so a dependency problem
      # surfaces here in the shape it would take in production.
      - name: Install dependencies
        run: uv sync --frozen --no-group dev

      # The unpooled URL, deliberately. The pooler is PgBouncer in transaction
      # mode, where Alembic's DDL and version-table locking do not reliably
      # hold across statements. Neither URL is ever echoed: both carry a
      # username and password.
      - name: Apply this PR's migrations to the preview branch
        env:
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url }}
        run: uv run alembic upgrade head

      # Catches the other half: a model changed with no migration written for
      # it. Nothing fails on that today — the test suite builds its schema from
      # ORM metadata with create_all, so tests pass against a table production
      # will not have, and the first request 500s. `alembic check` compares the
      # models against the database just migrated and fails if autogenerate
      # would still produce operations.
      - name: Check the models and the migrations agree
        env:
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url }}
        run: uv run alembic check

# The step above creates a new Neon branch.
# You may want to do something with the new branch, such as run migrations, run tests
# on it, or send the connection details to a hosting platform environment.
# The branch DATABASE_URL is available to you via:
# "${{ steps.create_neon_branch.outputs.db_url_with_pooler }}".
# It's important you don't log the DATABASE_URL as output as it contains a username and
# password for your database.
# For example, you can uncomment the lines below to run a database migration command:
#      - name: Run Migrations
#        run: npm run db:migrate
#        env:
#          # to use pooled connection
#          DATABASE_URL: "${{ steps.create_neon_branch.outputs.db_url_with_pooler }}"
#          # OR to use unpooled connection
#          # DATABASE_URL: "${{ steps.create_neon_branch.outputs.db_url }}"

# Following the step above, which runs database migrations, you may want to check
# for schema changes in your database. We recommend using the following action to
# post a comment to your pull request with the schema diff. For this action to work,
# you also need to give permissions to the workflow job to be able to post comments
# and read your repository contents. Add the following permissions to the workflow job:
#
# permissions:
#   contents: read
#   pull-requests: write
#
# You can also check out https://github.com/neondatabase/schema-diff-action for more
# information on how to use the schema diff action.
# You can uncomment the lines below to enable the schema diff action.
#      - name: Post Schema Diff Comment to PR
#        uses: neondatabase/schema-diff-action@v1
#        with:
#          project_id: ${{ vars.NEON_PROJECT_ID }}
#          compare_branch: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
#          api_key: ${{ secrets.NEON_API_KEY }}

  delete_neon_branch:
    name: Delete Neon Branch
    needs: setup
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
