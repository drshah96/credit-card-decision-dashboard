name: CI

on:
  pull_request:
    branches: [main, development, fixes]
  push:
    branches: [main, development, fixes]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.28"

      - name: Set up Python 3.13
        run: uv python install 3.13

      # `--frozen` installs from uv.lock without checking it still matches
      # pyproject.toml, and render.yaml's build command uses it too. So a
      # dependency added without committing the regenerated lock does not fail
      # anywhere: CI and production both install the old resolution, and the
      # missing package surfaces as an ImportError at run time instead. This
      # asserts the lock is current, which is what `--frozen` deliberately
      # does not do. It runs before install so the failure names the real
      # problem rather than a confusing downstream one.
      - name: Check uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Run tests
        run: npm run test -- --run
