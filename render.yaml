databases:
  # Render's free Postgres plan expires 30 days after creation (14-day grace
  # period, then hard deletion) — this database is being replaced by Neon
  # (see DATABASE_URL below) for exactly that reason. Left declared here
  # rather than removed outright: deleting a `databases:` entry from a
  # synced Render Blueprint can delete the underlying resource on the next
  # sync, and this shouldn't be torn down until the Neon migration is
  # confirmed working in production. Decommission manually from the Render
  # dashboard once that's verified, then remove this block in a follow-up.
  - name: credit-card-dashboard-db
    plan: free
    databaseName: card_catalog
    user: card_catalog

services:
  # FastAPI backend. Runs migrations + a catalog resync on every boot (not just
  # first deploy) so it stays correct even without Render's paid-only
  # Pre-Deploy Command feature — both alembic upgrade and seed_catalog are
  # idempotent, so re-running them on a restart is a no-op if nothing changed.
  - type: web
    name: thewalletaudit-api
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-group dev
    startCommand: >-
      uv run alembic upgrade head &&
      uv run python -m backend.scripts.seed_catalog &&
      uv run uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    # Custom domain — verified, DNS (Cloudflare, proxied CNAME to
    # thewalletaudit-api.onrender.com) is live and the cert is issued. SSL/TLS
    # mode on Cloudflare is "Full" — needed for the proxy to trust Render's
    # own cert instead of erroring or downgrading to plaintext.
    domains:
      - api.thewalletaudit.com
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      # Was fromDatabase: credit-card-dashboard-db (Render's own free
      # Postgres, which expires 30 days after creation — see the comment on
      # that database above). Now points at a Neon Postgres project
      # instead: a real, non-expiring free tier, and a drop-in replacement
      # requiring no code changes (backend/db.py's _normalize_database_url
      # already handles the generic postgres:// URL shape Neon hands out).
      # sync: false means this must be set manually in the Render
      # dashboard — a real connection string is a secret and shouldn't be
      # committed here.
      - key: DATABASE_URL
        sync: false
      # Locks CORS down to just the deployed frontend. Includes both the
      # custom domain and the default onrender.com URL so requests still work
      # during DNS setup/propagation for the custom domain. Update if the web
      # service's name/URL ever changes (see the matching note on
      # VITE_API_URL below).
      - key: ALLOWED_ORIGINS
        value: https://thewalletaudit.com,https://thewalletaudit.onrender.com

  # Vite/React frontend, built as a static site.
  - type: web
    name: thewalletaudit
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    # PR previews, scoped to this service only.
    #
    # The routing rules at the bottom of this block cannot be changed safely
    # without somewhere to test them. They are load-bearing: `/cards/<id>` has
    # no trailing slash, Render only serves a directory's index.html for paths
    # that do, and the catch-all would otherwise return the root shell for
    # every card page. Getting that wrong takes all 109 card pages and 9
    # issuer pages down at once, and today the only way to find out is to
    # deploy it to the live site.
    #
    # There is a known bug waiting on this: an unknown card id rewrites to a
    # file that doesn't exist and Render answers HTTP 200 with an empty body,
    # so a stale or mistyped card link renders a blank page and the SPA never
    # loads to say otherwise.
    #
    # Deliberately NOT set on the API service or the database above. A preview
    # of the API would need its own DATABASE_URL, which is `sync: false`
    # because it's a secret, so the preview would boot into a failing
    # migration. Static previews need no secrets and no database.
    previews:
      generation: automatic
    # Custom domain — verified; www also registered here and redirects to
    # the bare domain. DNS on Cloudflare: root + www are DNS-only (grey
    # cloud) as of 2026-08-07 — the free-plan "JS Detections" script that
    # Cloudflare force-injects into proxied HTML cost ~2.8s of mobile CPU
    # per page and cannot be disabled on free. Render's own static CDN
    # (which itself runs on Cloudflare's network, minus the injections)
    # serves the site. Only api.thewalletaudit.com stays proxied, for the
    # CF-IPCountry header the analytics read.
    domains:
      - thewalletaudit.com
    # Baseline security headers (issue #152, partial). With Cloudflare out of
    # the HTML path these are the only response-header mechanism the site
    # has. Deliberately no Content-Security-Policy yet: a wrong CSP silently
    # breaks GA and fonts, so it needs a Report-Only bake first — tracked in
    # the issue, not rushed out days before launch.
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
    envVars:
      # api.thewalletaudit.com is registered, verified, and has a live cert —
      # point the frontend at it directly instead of the onrender.com URL.
      - key: VITE_API_URL
        value: https://api.thewalletaudit.com/api
    # The build prerenders one HTML file per route (frontend/scripts/prerender.mjs)
    # so crawlers that never run JS — LinkedIn, Twitter/X, Facebook, Slack,
    # iMessage — read that route's own title and OpenGraph tags instead of the
    # generic shell.
    #
    # Those files land at e.g. dist/cards/<id>/index.html. Render serves a
    # directory's index.html only when the request path ends in a slash; for
    # "/cards/<id>" nothing matches that exact path, so the catch-all below
    # fired and returned the root shell. Every shared card link previewed as
    # the homepage, with og:url pointing there too.
    #
    # Every published URL ends in a slash, because that is the form Render
    # serves directly: a directory's index.html is only served for a path that
    # ends in one. These rules redirect the extensionless form onto it.
    #
    # They are redirects, not rewrites, and that is the whole fix. The rule
    # here used to rewrite `/cards/:id` to `/cards/:id/index.html`, which also
    # matched ids with no file behind them — and Render answers a rewrite onto
    # a missing file with HTTP 200 and an empty body, not a 404 and not a
    # fall-through to the next rule. A stale or mistyped card link rendered a
    # blank white page.
    #
    # A redirect has no such failure mode. `/cards/nope` redirects to
    # `/cards/nope/`, which matches no file and reaches the catch-all, which
    # serves the app. CardDetailPage then reads the API's 404, sets noindex and
    # renders "Card not found" — which it could always do, but was never served
    # the shell it needed to run.
    #
    # An earlier attempt enumerated one rewrite per real page instead, to avoid
    # changing any URL. It was correct in principle and Render never applied
    # it: the Blueprint sync left the old routes in place and triggered no
    # deploy, while the `headers` block from this same file stayed live. Six
    # rules that scale to any catalog size beat 122 that do not take effect.
    #
    # Order matters: Render evaluates top down, so the catch-all stays last.
    routes:
      - type: redirect
        source: /cards/:id
        destination: /cards/:id/
      - type: redirect
        source: /issuer/:slug
        destination: /issuer/:slug/
      - type: redirect
        source: /compare
        destination: /compare/
      - type: redirect
        source: /top-picks
        destination: /top-picks/
      - type: redirect
        source: /methodology
        destination: /methodology/
      # Everything else: client-side routing, and the app's own 404 page.
      - type: rewrite
        source: /*
        destination: /index.html
