databases:
  - name: credit-card-dashboard-db
    plan: free
    databaseName: card_catalog
    user: card_catalog

services:
  # FastAPI backend. Runs migrations + a catalog resync on every boot (not just
  # first deploy) so it stays correct even without Render's paid-only
  # Pre-Deploy Command feature — both alembic upgrade and seed_catalog are
  # idempotent, so re-running them on a restart is a no-op if nothing changed.
  - type: web
    name: credit-card-dashboard-api
    env: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-group dev
    startCommand: >-
      uv run alembic upgrade head &&
      uv run python -m backend.scripts.seed_catalog &&
      uv run uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DATABASE_URL
        fromDatabase:
          name: credit-card-dashboard-db
          property: connectionString
      # Locks CORS down to just the deployed frontend. Update if the web
      # service's name/URL ever changes (see the matching note on
      # VITE_API_URL below).
      - key: ALLOWED_ORIGINS
        value: https://credit-card-dashboard-web.onrender.com

  # Vite/React frontend, built as a static site.
  - type: web
    name: credit-card-dashboard-web
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      # Points at the backend service above. Render assigns that service's
      # .onrender.com URL once it's first created — update this if the
      # backend's name/URL ever changes.
      - key: VITE_API_URL
        value: https://credit-card-dashboard-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
