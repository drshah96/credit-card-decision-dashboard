[project]
name = "credit-card-decision-dashboard"
version = "0.1.0"
description = "A web tool to help decide which credit cards to keep or downgrade"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.1",
    "httpx2>=2.9.1",
    # For tests/backend/test_render_yaml.py, which parses render.yaml with a
    # real YAML parser rather than the regexes that generate it. Already
    # installed transitively via uvicorn[standard], but declared here because
    # a test that depends on another package's extra breaks confusingly when
    # that extra changes. Dev-only: the production build runs
    # `uv sync --frozen --no-group dev`.
    "pyyaml>=6.0.3",
]

[tool.ruff]
target-version = "py313"
line-length = 100
# Alembic's own templates (env.py, and every autogenerated revision under
# versions/) follow Alembic's import style, not this project's — excluded
# rather than hand-edited, since `alembic revision --autogenerate` would
# just regenerate the same "violations" on the next migration anyway.
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle errors, pyflakes, isort

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
